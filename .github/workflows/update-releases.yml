name: Update releases.json

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest release
        id: release
        run: |
          data=$(curl -s "https://api.github.com/repos/TannenWaddy/Amethyst-Launcher/releases/latest")
          tag=$(echo "$data" | jq -r '.tag_name // empty')
          files=$(echo "$data" | jq '[.assets[] | {name: .name, size: .size}]')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Write releases.json
        run: |
          cat > docs/public/releases.json <<ENDJSON
          {
            "version": "${{ steps.release.outputs.tag }}",
            "files": ${{ steps.release.outputs.files }}
          }
          ENDJSON

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/releases.json
          git diff --cached --quiet || git commit -m "chore: update releases.json"
          git push
